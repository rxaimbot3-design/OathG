services:
  - type: web
    name: enterprise-discord-ai-bot
    env: node
    buildCommand: npm ci && npm run build:native && npm run build:worker && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: DISCORD_OWNER_ID
        sync: false
      - key: ALLOWED_OWNERS
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
